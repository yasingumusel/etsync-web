<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Etsy Reviews - Settings</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #17171c;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-size: 12px; color: #6e6e78; margin: 6px 0 16px 0; line-height: 1.5; }
  input {
    width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 14px;
    border: 1px solid #d8d8e0; border-radius: 8px; outline: none;
  }
  input:focus { border-color: #7c4fe0; }
  .status { margin-top: 12px; font-size: 12px; }
  .status.ok { color: #0a8f5b; }
  .status.err { color: #d1372f; }
</style>
</head>
<body>
  <label for="sku">Product SKU</label>
  <input id="sku" type="text" placeholder="e.g. ETSY-4575363487" />
  <p class="hint">
    Find this on the product's page in your Wix Store dashboard, under
    "Inventory &rarr; SKU". This widget only shows reviews for the Etsy
    listing that made this exact product.
  </p>
  <div id="status" class="status"></div>

  <script type="module">
    import { editor, widget, application } from "https://cdn.jsdelivr.net/npm/@wix/editor/+esm";
    import { createClient } from "https://cdn.jsdelivr.net/npm/@wix/sdk/+esm";

    const statusEl = document.getElementById("status");
    const skuInput = document.getElementById("sku");

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = `status ${kind || ""}`;
    }

    const client = createClient({
      host: editor.host(),
      modules: { widget, application },
    });

    // Deliberately uses @wix/editor's own `application.getAppInstance()`
    // (an editor-platform bridge call) rather than the REST-backed
    // appInstances.getAppInstance() from @wix/app-management - real testing
    // showed the latter 403s when called from inside a settings panel
    // (Wix's docs note most widget-adjacent surfaces can't call Wix APIs
    // while previewed/edited in the Editor). This one is meant for exactly
    // this context.
    async function resolveInstanceId() {
      try {
        const result = await client.application.getAppInstance();
        const instanceId =
          (result && result.instanceId) || (result && result.instance && result.instance.instanceId);
        return instanceId ? { instanceId } : { error: `no instanceId in response: ${JSON.stringify(result)}` };
      } catch (err) {
        return { error: `application.getAppInstance() threw: ${err && err.message}` };
      }
    }

    async function init() {
      try {
        const [instanceResult, existingSku] = await Promise.all([
          resolveInstanceId(),
          client.widget.getProp("sku").catch(() => null),
        ]);

        if (existingSku) skuInput.value = existingSku;

        if (!instanceResult.instanceId) {
          setStatus(`DEBUG: ${instanceResult.error}`, "err");
          return;
        }

        // Set automatically - the merchant never has to know or enter this.
        await client.widget.setProp("instance-id", instanceResult.instanceId);
        setStatus("Ready.", "ok");
      } catch (err) {
        setStatus(`DEBUG init() threw: ${err && err.message}`, "err");
      }
    }

    let saveTimer;
    skuInput.addEventListener("input", () => {
      setStatus("Saving…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          await client.widget.setProp("sku", skuInput.value.trim());
          setStatus("Saved.", "ok");
        } catch {
          setStatus("Could not save. Try again.", "err");
        }
      }, 400);
    });

    init();
  </script>
</body>
</html>
